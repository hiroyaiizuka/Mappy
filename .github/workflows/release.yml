# manifest.version と同じタグ（例: 0.1.0。v は付けない）を push すると、check を通した
# 配布物 3 ファイル（main.js / manifest.json / styles.css）の attestation を作り、GitHub Release に添付する。
# BRAT とコミュニティプラグイン一覧はその Release の添付ファイルを読む（docs/harness.md「リリース手順」）。
#
# workflow_dispatch と、この workflow やリリース用スクリプトを変える PR では dry-run になる:
# 同じ手順で配布物を作って workflow artifact に上げ、Release は作らない。
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/version-bump.mjs"
      - "scripts/package-plugin.mjs"
      - "scripts/validate-release.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require the tag to match manifest.version
        id: version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: mappy-${{ steps.version.outputs.version }}
          path: |
            dist/mappy/main.js
            dist/mappy/manifest.json
            dist/mappy/styles.css
          if-no-files-found: error

  release:
    # タグの push だけ。dry-run（workflow_dispatch / pull_request）は build の artifact で終わる。
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mappy-${{ needs.build.outputs.version }}
          path: dist/mappy
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 0.x も通常の Release（LEV-249。一覧の掲載版が pre-release の例は無い）。ベータであることは
          # 版番号と README で示す。draft は BRAT から見えないので使わない。
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            dist/mappy/main.js dist/mappy/manifest.json dist/mappy/styles.css

  attest:
    # 添付した 3 ファイルと同じ artifact の build provenance。一覧への提出で推奨される（公式の
    # Release your plugin with GitHub Actions、docs/community-submission.md #35）。Release の後の別 job にして、
    # attestation が失敗しても Release（配布）は止めず、失敗した job だけを再実行できるようにする。
    # タグの push でしか動かないので、dry-run では確かめられない（docs/harness.md「リリース手順」4）。
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # actions/attest の README の権限: Sigstore の署名に id-token、保存に attestations と artifact-metadata。
      # contents: read は README の例（リポジトリの情報を読む）に合わせる。
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    # id-token（OIDC）は job のどの手順からも使えるので、この job の action はすべて動くタグではなく commit で固定する。
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mappy-${{ needs.build.outputs.version }}
          path: dist/mappy
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/mappy/main.js
            dist/mappy/manifest.json
            dist/mappy/styles.css
