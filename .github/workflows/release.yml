# manifest.version と同じタグ（例: 0.1.0。v は付けない）を push すると、
# check を通した配布物3ファイルを GitHub release に添付する。
# BRAT はこの release の main.js / manifest.json / styles.css を読む。
# 0.x は pre-release として作る。コミュニティへの公開審査とは別。
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require the tag to match manifest.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
      - run: npm run check
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            0.*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/mappy/main.js dist/mappy/manifest.json dist/mappy/styles.css
